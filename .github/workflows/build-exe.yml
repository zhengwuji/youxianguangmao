name: 编译PC端与手机端并发布Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '**/README.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pc:
    name: 编译PC端 exe（Windows）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 编译 PC端 exe
        shell: pwsh
        run: |
          & C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe `
            -nologo -target:winexe -codepage:65001 `
            -out:"fastcat-pc.exe" "电脑端\src\PC端.cs"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: pc-exe
          path: fastcat-pc.exe

  android:
    name: 重打包并签名手机端 APK（Linux）
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 下载构建工具（apktool / 签名器）
        run: |
          curl -fL -o apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
          curl -fL -o uber-apk-signer.jar https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar

      - name: 编译并签名手机端 APK
        run: |
          set -euo pipefail
          cd 源码/apktool工程
          java -jar ../../apktool.jar b . -o ../../fastcat-modified-unsigned.apk
          cd ../..
          java -jar uber-apk-signer.jar -a fastcat-modified-unsigned.apk --overwrite
          mv fastcat-modified-unsigned.apk fastcat-modified.apk
          rm -f fastcat-modified-unsigned.apk.idsig
          # 硬校验：结构完整 + v1/v2 签名必须真实存在（签名器参数错误时可能静默跳过）
          unzip -l fastcat-modified.apk | grep -q AndroidManifest.xml
          unzip -l fastcat-modified.apk | grep -q classes.dex
          unzip -l fastcat-modified.apk | grep -Eq 'META-INF/.*\.SF' || { echo "缺少v1签名"; exit 1; }
          grep -aq 'APK Sig Block 42' fastcat-modified.apk || { echo "缺少v2签名块"; exit 1; }
          echo "APK 签名校验通过"

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: fastcat-modified.apk

  release:
    name: 打包并发布 Release
    needs: [pc, android]
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 打包（PC端 + 手机端APK + gnirehtet relay + 使用说明）
        run: |
          mkdir -p "package/有线快猫-电脑端/gnirehtet-rust-win64"
          cp artifacts/pc-exe/fastcat-pc.exe "package/有线快猫-电脑端/有线快猫-电脑端.exe"
          cp artifacts/android-apk/fastcat-modified.apk "package/有线快猫-电脑端/有线快猫-手机端.apk"
          cp 电脑端/gnirehtet-rust-win64/gnirehtet.exe "package/有线快猫-电脑端/gnirehtet-rust-win64/"
          cp 电脑端/gnirehtet-rust-win64/开源声明.md "package/有线快猫-电脑端/gnirehtet-rust-win64/"
          { printf '\xef\xbb\xbf'; cat <<'EOF'
          有线快猫（改造版）使用说明

          一、安装
          1. 电脑安装 adb 并加入 PATH（命令行 adb version 可输出版本即可）
          2. 手机开启 开发者选项 -> USB 调试
          3. 手机安装改造版 APK（压缩包内有 有线快猫-手机端.apk）：
             adb install -r 有线快猫-手机端.apk
             若安装后图标消失（被手机管家类工具禁用）：
             adb shell pm enable com.liibei.fastcat

          二、连接上网
          1. USB 线连接手机与电脑，手机上允许 USB 调试
          2. 双击 有线快猫-电脑端.exe，约 20 秒后手机 App 显示"已连接"
          3. 保持文件夹结构不变（gnirehtet-rust-win64 子目录必须与主程序同级）
          4. 手机上直接用浏览器等任意应用上网
          5. 用完点击"停止全部"

          详细说明: https://github.com/zhengwuji/youxianguangmao
          EOF
          } > "package/有线快猫-电脑端/使用说明.txt"
          cd package && zip -r ../youxianguangmao.zip 有线快猫-电脑端 && cd ..
          unzip -l youxianguangmao.zip

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 自动构建 #${{ github.run_number }}
          body: |
            本次代码推送自动编译生成。

            压缩包 youxianguangmao.zip 内容：
            - 有线快猫-手机端.apk（手机端改造版，先装这个）
            - 有线快猫-电脑端.exe（PC 端监督程序）
            - gnirehtet-rust-win64/gnirehtet.exe（官方中继，Apache-2.0）
            - 使用说明.txt

            同时提供单独的 fastcat-modified.apk（与压缩包内相同）。

            使用方法见压缩包内"使用说明.txt"或仓库 README.md。
          files: |
            youxianguangmao.zip
            artifacts/android-apk/fastcat-modified.apk
