name: 编译PC端与手机端并发布Release

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '**/README.md'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 编译 PC端 exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          & C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe `
            -nologo -target:winexe -codepage:65001 `
            -out:"build\有线快猫-电脑端.exe" "电脑端\src\PC端.cs"
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 下载构建工具（apktool / 签名器）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools | Out-Null
          Invoke-WebRequest -Uri "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar" -OutFile "tools\apktool.jar"
          Invoke-WebRequest -Uri "https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar" -OutFile "tools\uber-apk-signer.jar"

      - name: 编译并签名手机端 APK
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          # 必须在工程目录内以 "." 构建：aapt2 子进程收到含中文的绝对路径会因编码问题找不到目录
          Push-Location "$ws\源码\apktool工程"
          & java -jar "$ws\tools\apktool.jar" b . -o "$ws\build\fastcat-modified-unsigned.apk"
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { exit $code }
          & java -jar "$ws\tools\uber-apk-signer.jar" --overwrite "$ws\build\fastcat-modified-unsigned.apk"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Move-Item "$ws\build\fastcat-modified-unsigned.apk" "$ws\build\fastcat-modified.apk" -Force
          Remove-Item "$ws\build\*.idsig" -ErrorAction SilentlyContinue

      - name: 打包（PC端 + 手机端APK + gnirehtet relay + 使用说明）
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          $pkg = "package\有线快猫-电脑端"
          New-Item -ItemType Directory -Force -Path "$pkg\gnirehtet-rust-win64" | Out-Null
          Copy-Item "$ws\build\有线快猫-电脑端.exe" $pkg
          Copy-Item "$ws\build\fastcat-modified.apk" "$pkg\有线快猫-手机端.apk"
          Copy-Item "$ws\电脑端\gnirehtet-rust-win64\gnirehtet.exe" "$pkg\gnirehtet-rust-win64\"
          Copy-Item "$ws\电脑端\gnirehtet-rust-win64\开源声明.md" "$pkg\gnirehtet-rust-win64\" -ErrorAction SilentlyContinue
          @'
          有线快猫（改造版）使用说明

          一、安装
          1. 电脑安装 adb 并加入 PATH（命令行 adb version 可输出版本即可）
          2. 手机开启 开发者选项 -> USB 调试
          3. 手机安装改造版 APK（压缩包内有 有线快猫-手机端.apk）：
             adb install -r 有线快猫-手机端.apk
             若安装后图标消失（被手机管家类工具禁用）：
             adb shell pm enable com.liibei.fastcat

          二、连接上网
          1. USB 线连接手机与电脑，手机上允许 USB 调试
          2. 双击 有线快猫-电脑端.exe，约 20 秒后手机 App 显示"已连接"
          3. 保持文件夹结构不变（gnirehtet-rust-win64 子目录必须与主程序同级）
          4. 手机上直接用浏览器等任意应用上网
          5. 用完点击"停止全部"

          详细说明: https://github.com/zhengwuji/youxianguangmao
          '@ | Out-File "$pkg\使用说明.txt" -Encoding utf8
          Compress-Archive -Path "package\有线快猫-电脑端" -DestinationPath "youxianguangmao.zip"

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 自动构建 #${{ github.run_number }}
          body: |
            本次代码推送自动编译生成。

            压缩包 youxianguangmao.zip 内容：
            - 有线快猫-手机端.apk（手机端改造版，先装这个）
            - 有线快猫-电脑端.exe（PC 端监督程序）
            - gnirehtet-rust-win64/gnirehtet.exe（官方中继，Apache-2.0）
            - 使用说明.txt

            同时提供单独的 fastcat-modified.apk（与压缩包内相同）。

            使用方法见压缩包内"使用说明.txt"或仓库 README.md。
          files: |
            youxianguangmao.zip
            build/fastcat-modified.apk
